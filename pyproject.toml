[project]
name = "agent-harness-for-slms"
version = "0.1.0"
description = "A CLI agent harness for small language models."
authors = [
    { name = "vishwajayawickrama", email = "pmvishwajayawickrama@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "typer>=0.27.0",
]

[project.scripts]
agent-harness-for-slms = "agent_harness_for_slms:app"

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
